server {
   listen 443 ssl;
   server_name demopizza.ru; 

   ssl_certificate /etc/letsencrypt/live/demopizza.ru/fullchain.pem;
   ssl_certificate_key /etc/letsencrypt/live/demopizza.ru/privkey.pem;

   location / {
      proxy_pass http://demopizza-client-container:80;
        
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
   }
}