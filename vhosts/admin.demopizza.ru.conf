server {
   listen 443 ssl;
   server_name admin.demopizza.ru; 

   ssl_certificate /etc/letsencrypt/live/admin.demopizza.ru/fullchain.pem;
   ssl_certificate_key /etc/letsencrypt/live/admin.demopizza.ru/privkey.pem;

   location / {
      root /var/www/admin.demopizza.ru;
      try_files $uri $uri/ /index.html;
   }
}