server {
   listen 443 ssl;
   server_name admin.demopizza.ru; 

   # ssl_certificate /etc/letsencrypt/live/admin.demopizza.ru/fullchain.pem;
   # ssl_certificate_key /etc/letsencrypt/live/admin.demopizza.ru/privkey.pem;

   location / {
      proxy_pass http://demopizza-admin-container:80;
        
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
   }
}