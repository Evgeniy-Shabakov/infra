server {
   listen 443 ssl;
   server_name api.demopizza.ru;

   ssl_certificate /etc/letsencrypt/live/api.demopizza.ru/fullchain.pem;
   ssl_certificate_key /etc/letsencrypt/live/api.demopizza.ru/privkey.pem;

   location /images/ {
      alias /var/www/api.demopizza.ru/storage/public/images/;
      expires 7d;
   }

   location / {
      proxy_pass http://demopizza-api-container:5000;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
   }
}
